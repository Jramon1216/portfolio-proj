services:
  dev-container-service:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: dev-container
    working_dir: /app
    stdin_open: true    
    tty: true 
    environment:
      - CHOKIDAR_USEPOLLING=true    
      - WATCHPACK_POLLING=true      
      - FAST_REFRESH=true           
      - POLLING_INTERVAL=100        
    volumes:
    - .:/app
    - /app/node_modules
    ports:
      - "8080:3000"
    

volumes:
  node_modules:
